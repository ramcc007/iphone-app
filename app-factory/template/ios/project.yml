# XcodeGen spec for the {{APP_NAME}} iPhone + iPad app.
# On a Mac: `brew install xcodegen`, then `cd ios && xcodegen`, then open {{TARGET}}.xcodeproj.
name: {{TARGET}}
options:
  bundleIdPrefix: {{BUNDLE_PREFIX}}          # reverse of {{DOMAIN}}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  {{TARGET}}Core:
    path: {{TARGET}}Core
targets:
  {{TARGET}}:
    type: application
    platform: iOS
    sources:
      - path: {{TARGET}}
    dependencies:
      - package: {{TARGET}}Core
    entitlements:
      path: {{TARGET}}/{{TARGET}}.entitlements
      # Listed here because XcodeGen writes this file from these properties (an empty list gave build 7 no Game Center or iCloud).
      properties:
        com.apple.developer.game-center: true                  # achievements and leaderboards (optional for the player)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)   # iCloud key-value progress sync
    info:
      path: {{TARGET}}/Info.plist
      properties:
        CFBundleDisplayName: {{APP_NAME}}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: {{APP_CATEGORY}}   # e.g. public.app-category.puzzle-games, strategy-games, word-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark   # remove if the app supports light mode too
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}    # permanent once registered with Apple
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"                  # iPhone and iPad
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
      configs:
        # Release is only built by .github/workflows/testflight.yml, which creates a short-lived Apple Distribution
        # certificate and App Store profile and passes the profile's name in APP_PROFILE_NAME. Debug stays automatic.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_NAME)
