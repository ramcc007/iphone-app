<title>Numfall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen game. Phone/tall = stacked column (max 540px). Wide (landscape iPad, desktop) = board left, side panel right. */
:root {
  color-scheme: dark;
  --bg: #13161F; --surface: #1E2230; --raised: #272C3D; --line: rgba(255,255,255,0.08);
  --fg: #F5F6FA; --soft: #D7DBE8; --muted: #A3A9BF; --faint: #8C92AB;
  --accent: #6B5CF0; --accent-edge: #4A3DC0; --accent-soft: #B3A8FF;
  --spark: #FFB547; --good: #6EE7A8; --bad: #FF6B7A; --pink: #FF8AD8;
  --given: #2A3045; --given-top: #363D57; --given-edge: #1C2030;
  --font: 'Fredoka', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, sans-serif;
  --tile: 48px; --gap: 6px; --boxgap: 8px;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
#app { height: 100%; box-sizing: border-box; padding-inline: 16px; display: flex; justify-content: center; }
.screen { width: 100%; max-width: 540px; height: 100%; display: flex; flex-direction: column; box-sizing: border-box; padding-block: 12px; gap: 10px; position: relative; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.wide .screen.game { max-width: 1400px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); column-gap: 36px; row-gap: 14px; padding-block: 24px; }
.wide .game .topbar { grid-column: 1 / -1; }
.wide .game .boardwrap { grid-column: 1; grid-row: 2; }
.wide .game .side { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 14px; }
.side { display: contents; }

/* Top bar and pills */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
.pill { height: 40px; padding: 0 14px; border-radius: 20px; background: var(--surface); display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; border: none; }
.pill.spark { color: var(--spark); }
.title-block { text-align: center; min-width: 0; }
.title-block .t { font-size: 20px; font-weight: 700; }
.title-block .s { font-size: 12px; font-weight: 500; color: var(--muted); }

/* Status row */
.status { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 18px; padding: 8px 12px; }
.hearts { display: flex; gap: 4px; }
.timer { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.timer b { font-size: 18px; }
.timer.warn { background: rgba(255,181,71,0.15); color: var(--spark); }
.timer.danger { background: rgba(255,107,122,0.2); color: var(--bad); }
.wide .status { flex-direction: column; align-items: stretch; gap: 12px; padding: 18px; border-radius: 24px; }
.wide .timer { justify-content: space-between; height: auto; padding: 8px 14px; border-radius: 18px; }
.wide .timer b { font-size: 48px; line-height: 1; }
.wide .status-row2 { display: flex; justify-content: space-between; align-items: center; }
.status-row2 { display: contents; }

.guide { text-align: center; font-size: 14px; font-weight: 500; color: var(--soft); min-height: 38px; line-height: 1.35; display: flex; align-items: center; justify-content: center; }
.guide.flash { font-size: 16px; font-weight: 700; }
.wide .guide { text-align: left; font-size: 16px; min-height: 44px; justify-content: flex-start; }
.flash { text-align: center; min-height: 26px; font-size: 18px; font-weight: 700; }
.flash.good { color: var(--good); } .flash.bad { color: var(--bad); } .flash.gold { color: var(--spark); } .flash.info { color: var(--muted); } .flash.pink { color: var(--pink); }

/* Board */
.boardwrap { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
.board { display: flex; gap: var(--gap); padding: 10px; border-radius: 22px; background: var(--surface); transition: filter 0.2s, opacity 0.2s; }
.board.hidden { filter: blur(14px); opacity: 0.35; pointer-events: none; }
.col { display: flex; flex-direction: column; gap: var(--gap); padding: 0; border: none; background: transparent; border-radius: 14px; }
.col.boxstart { margin-left: var(--boxgap); }
.col.cursor { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
.col.hint { outline: 3px solid var(--spark); outline-offset: 3px; }
.cell { width: var(--tile); height: var(--tile); box-sizing: border-box; border-radius: calc(var(--tile) * 0.26); display: flex; align-items: center; justify-content: center; font-size: calc(var(--tile) * 0.54); font-weight: 700; line-height: 1; }
.cell.rowstart { margin-top: var(--boxgap); }
.cell.empty { background: rgba(255,255,255,0.03); border: 1.5px dashed rgba(255,255,255,0.15); }
.cell.given { background: linear-gradient(180deg, var(--given-top) 0%, var(--given) 60%); color: #E6E9F2; box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.10), 0 4px 0 var(--given-edge); font-weight: 600; }
.cell.tile { background: linear-gradient(180deg, var(--t-light) 0%, var(--t-base) 58%); color: #13161F; box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 4px 0 var(--t-edge); }
.cell.ghost { border: 2px dashed var(--t-base); color: var(--t-base); opacity: 0.75; background: rgba(255,255,255,0.02); }
.cell.crack { background: rgba(255,107,122,0.22); border: 2px dashed var(--bad); color: var(--bad); animation: shake 0.4s; }
.cell.glow { box-shadow: 0 0 0 3px #FFFFFF, 0 0 18px rgba(255,255,255,0.6); }
.cell.fall { animation: fall 0.42s linear; }
@keyframes fall { 0% { transform: translateY(calc(-1 * var(--fall) * (var(--tile) + var(--gap)))); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.6); } 62% { transform: translateY(0) scale(1.08, 0.86); animation-timing-function: ease-out; } 80% { transform: translateY(-5px) scale(0.97, 1.05); } 100% { transform: translateY(0) scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* Tray and controls */
.tray { display: flex; justify-content: center; gap: 8px; }
.tray .num { flex: 1 1 0; min-width: 0; max-width: 56px; }
.tray.two-rows { display: grid; grid-template-columns: repeat(5, minmax(0, 56px)); justify-content: center; }
.tray.two-rows .num { max-width: none; height: 54px; }
.tray.nine { gap: 4px; } .tray.nine .num { max-width: none; height: 52px; border-radius: 12px; } .tray.nine .num b { font-size: 22px; }
.wide .tray, .wide .tray.two-rows { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.wide .tray .num { max-width: none; }
.num { width: 52px; height: 62px; border-radius: 15px; border: 3px solid transparent; color: #13161F; background: linear-gradient(180deg, var(--t-light) 0%, var(--t-base) 58%); box-shadow: inset 0 2px 0 rgba(255,255,255,0.45), 0 5px 0 var(--t-edge); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.12s; }
.num b { font-size: 27px; line-height: 1; } .num span { font-size: 11px; font-weight: 600; }
.num.on { border-color: #FFFFFF; transform: translateY(-6px); }
.num.out { opacity: 0.25; }
.wide .num { width: auto; height: 100px; border-radius: 22px; } .wide .num b { font-size: 46px; } .wide .num span { font-size: 14px; }
.controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.wide .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; }
.wide .controls .ctl { flex: 1 1 auto; white-space: nowrap; }
.ctl { height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: var(--surface); font-size: 15px; font-weight: 600; white-space: nowrap; }
.wide .ctl { height: 56px; font-size: 16px; }
.ctl.gold { color: var(--spark); }

/* Buttons and sheets */
.primary { height: 58px; border-radius: 29px; border: none; background: var(--accent); color: #FFFFFF; font-size: 19px; font-weight: 700; box-shadow: 0 5px 0 var(--accent-edge); width: 100%; }
.secondary { height: 50px; border-radius: 25px; border: none; background: rgba(255,255,255,0.08); font-size: 16px; font-weight: 600; width: 100%; }
.dashed { height: 50px; border-radius: 25px; border: 1.5px dashed rgba(255,181,71,0.6); background: transparent; color: var(--spark); font-size: 16px; font-weight: 600; width: 100%; }
.dashed:disabled { opacity: 0.45; cursor: default; }
.link { background: none; border: none; color: var(--accent-soft); font-size: 15px; font-weight: 600; padding: 8px; }
.veil { position: fixed; inset: 0; background: rgba(8,9,14,0.62); display: flex; align-items: flex-end; justify-content: center; z-index: 5; padding: env(safe-area-inset-top, 0px) 12px calc(env(safe-area-inset-bottom, 0px) + 8px); box-sizing: border-box; }
.wide .veil { align-items: center; }
.sheet { width: 100%; max-width: 520px; box-sizing: border-box; background: var(--raised); border: 1.5px solid var(--line); border-radius: 32px; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 4px; max-height: 100%; overflow-y: auto; }
.sheet h2 { margin: 0; font-size: 28px; font-weight: 700; text-wrap: balance; }
.sheet p { margin: 0; font-size: 16px; line-height: 1.45; color: var(--soft); }
.sheet.win { border-color: rgba(110,231,168,0.5); } .sheet.win h2 { color: var(--good); }
.sheet.lose { border-color: rgba(255,107,122,0.5); } .sheet.lose h2 { color: var(--bad); }
.stars { display: flex; gap: 8px; }
.breakdown { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--soft); }
.breakdown div { display: flex; justify-content: space-between; } .breakdown b { color: var(--spark); }
.chest { display: flex; align-items: center; gap: 12px; background: rgba(255,181,71,0.12); border: 1.5px solid var(--spark); border-radius: 18px; padding: 12px 14px; color: var(--spark); font-weight: 600; }
.sharebox { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--soft); -webkit-user-select: text; user-select: text; }

/* Home */
.home { gap: 16px; }
.home > * { flex-shrink: 0; }
.wide .screen.home { max-width: 820px; }
.hero { display: flex; align-items: center; gap: 18px; padding: 8px 4px; }
.hero h1 { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
.hero p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.logo { display: grid; grid-template-columns: repeat(2, 30px); gap: 5px; flex-shrink: 0; }
.logo i { width: 30px; height: 30px; border-radius: 9px; display: block; }
.chapter { background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.chapter-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chapter-head .n { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
.chapter-head .t { font-size: 20px; font-weight: 700; }
.chapter-head .st { font-size: 14px; font-weight: 700; color: var(--spark); white-space: nowrap; }
.chapter-head .sub { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 3px; }
.flames { display: inline-flex; gap: 1px; align-items: center; }
.flames svg { width: 15px; height: 15px; display: block; }
.flames .on { fill: #FF8A4C; } .flames .off { fill: #3A4058; }
.chapter.closed .sub { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; margin-top: 3px; }
.chapter.closed .flames .on { fill: #8C92AB; }
.levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.wide .levels { grid-template-columns: repeat(10, minmax(0, 1fr)); }
.lv { height: 60px; border-radius: 16px; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 19px; font-weight: 700; }
.lv small { font-size: 10px; letter-spacing: 0.5px; font-weight: 600; }
.lv.done { background: linear-gradient(180deg, var(--given-top) 0%, var(--given) 60%); box-shadow: 0 4px 0 var(--given-edge); }
.lv.done small { color: var(--spark); }
.lv.next { background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 0 var(--accent-edge), 0 0 18px rgba(107,92,240,0.5); }
.lv.skipped { background: transparent; border: 1.5px solid rgba(255,181,71,0.5); color: var(--spark); }
.lv.locked { background: transparent; border: 1.5px dashed rgba(255,255,255,0.15); color: var(--faint); cursor: pointer; }
.lv.locked small { display: flex; align-items: center; gap: 3px; opacity: 0.8; } .lv .lk { display: block; }
.praise-sub { margin: -6px 0 0; text-align: center; color: var(--soft); font-size: 15px; font-weight: 600; }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 440px; margin: 0 auto; padding: 12px 16px; border-radius: 16px; background: var(--raised, #272C3D); color: var(--fg, #F5F6FA); font-size: 15px; font-weight: 600; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 50; }
.lv.mile { border: 2px solid var(--spark); }
.boards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.bd { min-height: 112px; border-radius: 20px; border: 2px solid transparent; background: var(--surface); padding: 10px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.bd svg { margin-bottom: 4px; }
.bd .nm { font-size: 17px; font-weight: 700; }
.bd .sz { font-size: 13px; font-weight: 600; color: var(--soft); }
.bd .pr { font-size: 12px; font-weight: 500; color: var(--muted); }
.bd.on { border-color: var(--accent-soft); background: rgba(107,92,240,0.2); }
.wide .bd { min-height: 132px; } .wide .bd .nm { font-size: 20px; }
.bd-info { text-align: center; font-size: 14px; line-height: 1.4; color: var(--soft); margin-top: -4px; }
.chapter.closed { flex-direction: row; align-items: center; justify-content: space-between; padding: 14px 16px; color: var(--faint); }
.chapter.closed .t { font-size: 16px; }
.note { font-size: 13px; line-height: 1.5; color: var(--muted); text-align: center; padding: 4px 8px 12px; }
.rules { display: flex; flex-direction: column; gap: 8px; }
.rule { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 16px; padding: 10px 12px; }
.rule .ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #13161F; font-weight: 700; flex-shrink: 0; }
.rule b { display: block; font-size: 16px; } .rule span { font-size: 14px; color: var(--soft); line-height: 1.35; }
.lesson { background: var(--surface); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.lesson .tag { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; }
.lesson b { font-size: 20px; } .lesson p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
input { font-family: inherit; -webkit-user-select: text; user-select: text; }

/* Backdrop, effects and motion */
#bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; background: radial-gradient(120% 70% at 12% -10%, rgba(107,92,240,0.30), transparent 60%), radial-gradient(90% 60% at 105% 108%, rgba(79,195,247,0.16), transparent 60%), radial-gradient(70% 50% at 50% 50%, rgba(255,138,216,0.05), transparent 70%), var(--bg); }
#bg i { position: absolute; display: block; top: 0; left: var(--x); width: var(--s); height: var(--s); border-radius: 24%; background: var(--c); opacity: 0.17; animation: drift var(--d) linear infinite; animation-delay: var(--dl); }
@keyframes drift { from { transform: translateY(-20vh) rotate(0deg); } to { transform: translateY(120vh) rotate(var(--r)); } }
#app { position: relative; z-index: 1; }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.pf { position: absolute; width: 7px; height: 7px; margin: -3px 0 0 -3px; border-radius: 2px; animation: fly 0.8s ease-out forwards; }
@keyframes fly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0.4); opacity: 0; } }
.conf { position: absolute; top: -24px; width: 10px; height: 15px; border-radius: 2px; animation: confetti var(--t) cubic-bezier(0.25, 0.6, 0.45, 1) forwards; }
@keyframes confetti { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }
.gain { position: absolute; font-size: 22px; font-weight: 700; color: var(--spark); text-shadow: 0 2px 8px rgba(0,0,0,0.6); white-space: nowrap; animation: rise 1.05s ease-out forwards; }
@keyframes rise { 0% { transform: translate(-50%, 6px) scale(0.6); opacity: 0; } 18% { transform: translate(-50%, -8px) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -64px) scale(1); opacity: 0; } }
#app[data-anim-screen] .screen { animation: enter 0.42s cubic-bezier(0.2, 0.8, 0.2, 1); }
#app[data-anim-sheet] .sheet { animation: sheetIn 0.5s cubic-bezier(0.2, 1.15, 0.3, 1); }
#app[data-anim-sheet] .veil { animation: fadeIn 0.25s ease-out; }
#app[data-anim-sheet] .stars svg { animation: starIn 0.6s cubic-bezier(0.2, 1.5, 0.4, 1) both; animation-delay: calc(var(--i) * 0.2s + 0.25s); }
@keyframes enter { from { opacity: 0; transform: translateY(16px); } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(46px) scale(0.95); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes starIn { from { opacity: 0; transform: scale(0) rotate(-60deg); } }
.jolt { animation: jolt 0.4s; }
@keyframes jolt { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.logo i { animation: bob 3.2s ease-in-out infinite; } .logo i:nth-child(2) { animation-delay: 0.4s; } .logo i:nth-child(3) { animation-delay: 0.8s; } .logo i:nth-child(4) { animation-delay: 1.2s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.pulse { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 5px 0 var(--accent-edge), 0 0 0 0 rgba(107,92,240,0.55); } 50% { box-shadow: 0 5px 0 var(--accent-edge), 0 0 0 14px rgba(107,92,240,0); } }
.lv.next { animation: glow 2s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 4px 0 var(--accent-edge), 0 0 10px rgba(107,92,240,0.4); } 50% { box-shadow: 0 4px 0 var(--accent-edge), 0 0 26px rgba(107,92,240,0.85); } }
.bd, .lv, .ctl, .primary, .secondary { transition: transform 0.12s, background 0.2s, border-color 0.2s; }
.bd:active, .lv:active, .ctl:active { transform: scale(0.94); } .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-edge); }
.bd.on { box-shadow: 0 0 24px rgba(107,92,240,0.35); }
.num.on { animation: popnum 0.25s ease-out; } @keyframes popnum { 0% { transform: translateY(0) scale(1); } 60% { transform: translateY(-9px) scale(1.08); } 100% { transform: translateY(-6px) scale(1); } }
.cell.ghost { animation: ghost 1.1s ease-in-out infinite; } @keyframes ghost { 50% { opacity: 0.35; } }
.flash { animation: flashIn 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); } @keyframes flashIn { from { transform: scale(0.7); opacity: 0; } }
.timer.danger { animation: tick 1s ease-in-out infinite; } @keyframes tick { 50% { transform: scale(1.1); } }
.status { position: relative; overflow: hidden; }
.tbar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,0.07); }
.tbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-soft)); border-radius: 0 3px 3px 0; transition: width 1s linear; }
.tbar.warn i { background: var(--spark); } .tbar.danger i { background: var(--bad); }
.sheet .sub { font-size: 13px; line-height: 1.4; color: var(--muted); text-align: center; margin-top: -6px; }
.sheet .tip { font-size: 14px; line-height: 1.4; color: var(--soft); background: rgba(255,255,255,0.05); border-radius: 14px; padding: 10px 12px; }
.primary:disabled { opacity: 0.4; box-shadow: none; cursor: default; }
/* Welcome and player */
.welcome { gap: 14px; padding-block: 20px; }
.welcome h1 { margin: 4px 0 0; font-size: 34px; line-height: 1.1; text-align: center; }
.legal { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; margin-top: 4px; }
.legal a { color: var(--accent-soft); font-size: 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }
.wl-p { margin: 0; text-align: center; font-size: 16px; line-height: 1.45; color: var(--soft); }
.wl-board { align-self: center; display: flex; gap: 6px; padding: 10px; border-radius: 22px; background: var(--surface); box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
.wl-col { display: flex; flex-direction: column; gap: 6px; }
.wl-col span { width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; box-sizing: border-box; }

  window.addEventListener('resize', function () { var a = document.activeElement; if (a && a.tagName === 'INPUT') return; render(); });

  // ---------- rendering ----------
  function timerPct(g) { return Math.max(0, Math.round(g.timeLeft / g.level.timeLimit * 1000) / 10); }
  function timerBar(g) { return '<div class="tbar ' + (g.timeLeft <= 10 ? 'danger' : g.timeLeft <= 30 ? 'warn' : '') + '" aria-hidden="true"><i id="tfill" style="width:' + timerPct(g) + '%"></i></div>'; }
  function timerClass(g) { return 'timer' + (g.timeLeft <= 10 ? ' danger' : g.timeLeft <= 30 ? ' warn' : ''); }
  function timerInner(g) { return isWide() ? '<span>Time left</span><b>' + g.timeLeft + 's</b>' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="12" y2="9"/><line x1="10" y1="2" x2="14" y2="2"/></svg><b>' + g.timeLeft + 's</b>'; }
  function hearts(g, size) { var h = ''; for (var i = 0; i < D.HEARTS; i++) h += '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + (i < g.hearts ? '#FF6B7A' : 'none') + '" stroke="#FF6B7A" stroke-width="2" aria-hidden="true">' + HEART + '</svg>'; return '<div class="hearts" role="img" aria-label="' + g.hearts + ' hearts left">' + h + '</div>'; }
  function starsSvg(n, size) { var h = ''; for (var i = 0; i < 3; i++) h += '<svg style="--i:' + i + '" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="' + (i < n ? '#FFB547' : 'none') + '" stroke="#FFB547" stroke-width="1.6" aria-hidden="true">' + STAR + '</svg>'; return '<div class="stars" role="img" aria-label="' + n + ' of 3 stars">' + h + '</div>'; }

  // Tile size from the space the board really has: everything else is laid out first, then the board
  // fills what is left (the .boardwrap box). Before the first layout, a fair estimate is used.
  function sizeBoard(n, availW, availH) {
    var wide = isWide(), body = document.body;
    var gap = n >= 9 ? 4 : wide ? 10 : 6, boxgap = n >= 9 ? 6 : wide ? 14 : 8, boxes = n === 9 ? 2 : 1;
    if (availW === undefined) {
      var W = Math.min(body.clientWidth - 32, wide ? body.clientWidth : 540), H = body.clientHeight;
      availW = wide ? W - 380 - 36 : W; availH = wide ? H - 140 : H - (n >= 9 && H >= 750 ? 370 : 318);
    }
    var gapsW = (n - 1) * gap + boxes * boxgap + 20, gapsH = (n - 1) * gap + (n / (n === 9 ? 3 : 2) - 1) * boxgap + 20;
    var t = Math.floor(Math.min((availW - gapsW) / n, (availH - gapsH) / n));
    t = Math.max(24, Math.min(wide ? 96 : 92, t));
    var root = document.documentElement.style;
    root.setProperty('--tile', t + 'px'); root.setProperty('--gap', gap + 'px'); root.setProperty('--boxgap', boxgap + 'px');
  }
  function fitBoard() {
    var wrap = document.querySelector('.boardwrap'), board = document.querySelector('.board');
    if (!wrap || !board || !S.game) return;
    board.style.display = 'none';                       // measure the space without the board in it
    var w = wrap.clientWidth, h = wrap.clientHeight;
    board.style.display = '';
    if (w > 0 && h > 0) sizeBoard(S.game.n, w, h);
  }

  function boardHtml(g) {
    var n = g.n, html = '', ghostRows = {};
    if (S.sel !== null && g.status === 'play') for (var c0 = 0; c0 < n; c0++) ghostRows[c0] = D.landing(g, c0);
    var lesson = inLesson() ? LESSONS[S.lesson] : null, guideStep = lesson && lesson.steps && g.status === 'play' ? lesson.steps[S.step] : null;
    for (var c = 0; c < n; c++) {
      var land = D.landing(g, c), gapsLeft = 0, cells = '';
      for (var r = 0; r < n; r++) {
        var v = g.grid[r][c], cls = 'cell', style = '', label = v || '';
        if (r > 0 && r % g.br === 0) cls += ' rowstart';
        if (S.crack && S.crack.r === r && S.crack.c === c) { cls += ' crack'; label = S.crack.v; }
        else if (v && !g.placed[r][c]) cls += ' given';
        else if (v) { cls += ' tile'; style = tileVars(v); if (S.anim && S.anim.r === r && S.anim.c === c) { cls += ' fall'; style += ';--fall:' + (r + 1); } }
        else if (ghostRows[c] === r) { cls += ' ghost'; style = tileVars(S.sel); label = S.sel; }
        else cls += ' empty';
        if (!v) gapsLeft++;
        if (S.glow.indexOf(r + ',' + c) >= 0 && v) cls += ' glow';
        cells += '<span class="' + cls + '" style="' + style + '" aria-hidden="true">' + label + '</span>';
      }
      var ccls = 'col' + (c > 0 && c % g.bc === 0 ? ' boxstart' : '') + (S.hintCol === c || (guideStep && guideStep.c === c && S.sel === guideStep.v) ? ' hint' : '') + (S.cursorShown && S.cursor === c ? ' cursor' : '');
      var aria = 'Column ' + (c + 1) + ': ' + (land < 0 ? 'full' : gapsLeft + ' gap' + (gapsLeft === 1 ? '' : 's') + ', next number lands in row ' + (land + 1));
      html += '<button class="' + ccls + '" data-act="drop" data-c="' + c + '" aria-label="' + aria + '">' + cells + '</button>';
    }
    return '<div class="board' + (S.paused ? ' hidden' : '') + '">' + html + '</div>';
  }

  function trayHtml(g) {
    var h = '', lesson = inLesson() ? LESSONS[S.lesson] : null, guideStep = lesson && lesson.steps && g.status === 'play' ? lesson.steps[S.step] : null;
    for (var v = 1; v <= g.n; v++) {
      var left = D.left(g, v), on = S.sel === v;
      var extra = guideStep && guideStep.v === v && !on ? ';outline:3px solid #FFB547;outline-offset:3px' : '';
      h += '<button class="num' + (on ? ' on' : '') + (left === 0 ? ' out' : '') + '" style="' + tileVars(v) + extra + '" data-act="pick" data-v="' + v + '" aria-pressed="' + on + '" aria-label="Number ' + v + ', ' + left + ' left">' + '<b>' + v + '</b><span>×' + left + '</span></button>';
    }
    // 9 numbers: two rows of big tiles when there's height to spare, one row on short phones (iPhone SE) so the board stays usable.
    return '<div class="tray' + (g.n >= 9 ? (window.innerHeight >= 750 || isWide() ? ' two-rows' : ' nine') : '') + '">' + h + '</div>';
  }

  function guideText(g) {
    if (S.guideOverride) return S.guideOverride;
    if (inLesson()) { var L = LESSONS[S.lesson]; if (L.steps && L.stepText[S.step]) return L.stepText[S.step]; }
    if (g.status === 'timeup') return 'The clock ran out';
    return S.sel === null ? 'Pick a number, then tap a column' : 'Tap a column to drop the ' + S.sel + '. The dashed tile shows where it lands.';
  }

  function gameScreen() {
    var g = S.game, lv = g.level, lesson = inLesson() ? LESSONS[S.lesson] : null;
    sizeBoard(g.n);
    var top = '<div class="topbar">' +
      (lesson ? '<button class="iconbtn" data-act="rules" aria-label="How to play">?</button>' : '<button class="iconbtn" data-act="pause" aria-label="Pause"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="5" x2="8" y2="19"/><line x1="16" y1="5" x2="16" y2="19"/></svg></button>') +
      '<div class="title-block"><div class="t">' + (lesson ? 'Tutorial · Level ' + (S.lesson + 1) + ' of 3' : boardById(lv.board).name + ' · Level ' + lv.number) + '</div><div class="s">' + (lesson ? 'No timer while you learn' : (P.profile ? esc(P.profile.name) + ' · ' : '') + lv.timeLimit + '-second limit') + '</div></div>' +
      (lesson ? '<button class="pill" data-act="skipTutorial">Skip</button>' : '<button class="iconbtn" data-act="rules" aria-label="How to play">?</button>') + '</div>';
    var status = lesson ? (lesson.hearts ? '<div class="status">' + hearts(g, 24) + '<span style="color:var(--muted);font-size:14px">3 hearts</span></div>' : '<div class="lesson"><span class="tag">' + esc(lesson.title.toUpperCase()) + '</span><p>' + esc(lesson.text) + '</p></div>') :
      '<div class="status"><div id="timer" class="' + timerClass(g) + '" aria-label="' + g.timeLeft + ' seconds left">' + timerInner(g) + '</div><div class="status-row2">' + hearts(g, isWide() ? 30 : 22) + '<span class="pill spark" style="background:transparent;padding:0" aria-label="' + P.wallet + ' Sparks">' + SPARK + P.wallet + '</span></div>' + timerBar(g) + '</div>';
    if (lesson && lesson.hearts) status = '<div class="lesson"><span class="tag">' + esc(lesson.title.toUpperCase()) + '</span><p>' + esc(lesson.text) + '</p></div>' + status;
    var controls = lesson ? '<div class="controls"><button class="ctl" data-act="undo">Undo</button><button class="ctl" data-act="restart">Restart</button></div>' :
      '<div class="controls"><button class="ctl" data-act="undo" aria-label="Undo, ' + (g.undosLeft > 0 ? g.undosLeft + ' free' : COST.undo + ' Sparks') + '">Undo · ' + (g.undosLeft > 0 ? g.undosLeft : COST.undo + ' ✦') + '</button><button class="ctl gold" data-act="hint">Hint · ' + COST.hint + ' ✦</button><button class="ctl" data-act="restart">Restart</button></div>';
    // Phones: one line shows the latest feedback (Crack!, DOUBLE!...) or else the guide, so the board gets the room.
    var line = isWide() || !S.flash ? '<div class="guide">' + esc(guideText(g)) + '</div>' : '<div class="guide flash ' + S.flashKind + '">' + esc(S.flash) + '</div>';
    var side = '<div class="side">' + status + line + (isWide() ? trayHtml(g) + '<div class="flash ' + S.flashKind + '">' + esc(S.flash) + '</div>' : '') + (isWide() ? controls : '') + '</div>';
    var main = '<div class="boardwrap">' + boardHtml(g) + '</div>';
    var phoneBottom = isWide() ? '' : trayHtml(g) + controls;
    return '<div class="screen game">' + top + (isWide() ? main + side : side + main + phoneBottom) + overlayHtml() + '</div>';
  }

  function overlayHtml() {
    var g = S.game, o = S.overlay;
    if (S.paused && !o) return '<div class="veil"><div class="sheet"><h2>Paused</h2><p>The clock is stopped and the board is hidden, so pausing can’t buy thinking time.</p><button class="primary" data-act="resume">Resume</button><button class="secondary" data-act="restart">Restart level</button><button class="secondary" data-act="rules">How to play</button><button class="link" data-act="home">Back to the map</button></div></div>';
    if (!o) return '';
    var lv = g ? g.level : null, fails = lv ? (P.fails[lv.id] || 0) : 0;
    var skip = '', tip = '';
    if (lv && lv.number) {
      var more = SKIP_AFTER - fails;
      skip = more > 0
        ? '<button class="dashed" data-act="skip" disabled>Skip this level · ' + COST.skip + ' ✦</button><div class="sub">Unlocks after ' + SKIP_AFTER + ' tries (' + more + ' more). Skipped levels stay on your map.</div>'
        : '<button class="dashed" data-act="skip"' + (P.wallet < COST.skip ? ' disabled' : '') + '>Stuck? Skip this level · ' + COST.skip + ' ✦' + (P.wallet < COST.skip ? ' (you have ' + P.wallet + ')' : '') + '</button>';
      tip = '<div class="tip"><b>Tip:</b> ' + esc(TIPS[fails % TIPS.length]) + '</div>';
    }
    if (o === 'won') {
      var r = S.result, last = S.levelIndex === LEVELS.length - 1;
      var rows = S.replay ? '<div><span>Replay: ' + (S.award ? 'new stars' : 'no new stars') + '</span><b>+' + S.award + ' ✦</b></div>' : r.breakdown.map(function (b) { return '<div><span>' + esc(b.label) + '</span><b>+' + b.n + ' ✦</b></div>'; }).join('');
      var share = 'Numfall ' + boardById(lv.board).name + ' · Level ' + lv.number + ' ' + '★★★'.slice(0, r.stars) + '☆☆☆'.slice(0, 3 - r.stars) + ' · ' + g.timeLeft + 's to spare';
      var cleared = Object.keys(P.best).length;
      var headline = S.replay ? (S.award ? 'Better than before!' : 'Nice replay!') : D.praise(cleared);
      var subline = 'Level ' + lv.number + ' cleared' + (r.stars === 3 ? ' · Perfect, no mistakes' : '') + (!S.replay && D.praiseIsNew(cleared) ? ' · New title!' : '');
      return '<div class="veil"><div class="sheet win"><h2>' + esc(headline) + '</h2><p class="praise-sub">' + esc(subline) + '</p>' + starsSvg(r.stars, 46) +
        '<div class="breakdown">' + rows + '</div>' + (S.chest ? '<div class="chest">' + SPARK + 'Chapter ' + lv.chapter + ' · ' + esc(D.chapterName(lv.board, lv.chapter)) + ' complete: chest +' + S.chest + ' Sparks</div>' : '') +
        '<p style="font-size:14px">Wallet: ' + P.wallet + ' Sparks</p>' +
        (last ? '<p>That’s every ' + boardById(lv.board).name + ' level! Try another board for a new challenge.</p><button class="primary" data-act="home">Choose a board</button>' : '<button class="primary" data-act="next">Next: Level ' + (lv.number + 1) + '</button>') +
        '<button class="secondary" data-act="share" data-text="' + esc(share) + '">' + (S.copied ? 'Copied!' : 'Share result') + '</button>' + (S.copied === 'fail' ? '<div class="sharebox">' + esc(share) + '</div>' : '') +
        (last ? '' : '<button class="link" data-act="home">Back to the map</button>') + '</div></div>';
    }
    if (o === 'timeup') return '<div class="veil"><div class="sheet lose"><h2>Time’s up!</h2><p>You filled ' + g.history.length + ' of ' + lv.gaps + ' gaps. Level ' + lv.number + ' starts again with a fresh board and the full ' + lv.timeLimit + ' seconds.</p><button class="primary" data-act="restart">Start Level ' + lv.number + ' again</button>' + skip + tip + '<button class="secondary" data-act="home">Switch board or level</button></div></div>';
    if (o === 'lost') return '<div class="veil"><div class="sheet lose"><h2>Out of hearts</h2><p>Level ' + lv.number + ' starts again with a fresh board and the full ' + lv.timeLimit + ' seconds.</p><button class="primary" data-act="restart">Start again</button>' +
      (g.heartBought ? '' : '<button class="secondary" data-act="heart"' + (P.wallet < COST.heart ? ' disabled style="opacity:0.45"' : '') + '>+1 heart, keep this board · ' + COST.heart + ' ✦</button>') + skip + tip + '<button class="secondary" data-act="home">Switch board or level</button></div></div>';
    if (o === 'skipped') { var end = S.levelIndex === LEVELS.length - 1; return '<div class="veil"><div class="sheet"><h2 style="color:var(--spark)">Level skipped</h2><p>' + (end ? '' : 'Level ' + (lv.number + 1) + ' is unlocked. ') + 'Level ' + lv.number + ' stays on your map so you can come back for the stars.</p>' + (end ? '' : '<button class="primary" data-act="next">Play Level ' + (lv.number + 1) + '</button>') + '<button class="' + (end ? 'primary' : 'link') + '" data-act="home">Back to the map</button></div></div>'; }
    if (o === 'lessonWon') { var lastL = S.lesson === LESSONS.length - 1; return '<div class="veil"><div class="sheet win"><h2>' + (lastL ? 'You’re ready!' : 'Level ' + (S.lesson + 1) + ' done!') + '</h2><p>' + esc(LESSONS[S.lesson].win) + '</p>' + (lastL ? '<div class="chest">' + SPARK + 'Welcome gift: +' + WELCOME + ' Sparks</div><button class="primary" data-act="boards">Choose your board</button>' : '<button class="primary" data-act="nextLesson">Next level</button>') + '</div></div>'; }
    if (o === 'lessonLost') return '<div class="veil"><div class="sheet lose"><h2>Out of hearts</h2><p>That’s how a level is lost. No penalty here, so try again!</p><button class="primary" data-act="restart">Try again</button></div></div>';
    if (o === 'rules') return rulesSheet();
    if (o === 'player') return playerSheet();
    return '';
  }

  function rulesSheet() {
    var rules = [['✓', '#6EE7A8', 'One of each', 'Each row, column and box holds each number once.'], ['↓', '#4FC3F7', 'Numbers fall', 'Pick a number, tap a column: it drops to the lowest gap. So fill lower gaps first.'],
      ['3', '#FF8AD8', 'Three boards', 'Quick 4×4, Classic 6×6 or Master 9×9. All open from the start.'], ['28s', '#FFB547', 'Beat the countdown', 'Every level has one: about 28 seconds on the first Quick levels, a few minutes on Master. Time’s up = start again.'], ['♥', '#FF6B7A', '3 hearts', 'A wrong drop cracks and costs a heart.'],
      ['★', '#FFB547', 'Up to 3 stars', 'No mistakes, with a quarter of the time still left.'], ['✦', '#9D8CFF', 'Sparks', 'Earned by playing. Spend them on hints, or 400 to skip a level after 2 tries.']];
    return '<div class="veil"><div class="sheet"><h2>How to play</h2><div class="rules">' + rules.map(function (r) { return '<div class="rule"><div class="ic" style="background:' + r[1] + '">' + r[0] + '</div><div><b>' + r[2] + '</b><span>' + r[3] + '</span></div></div>'; }).join('') +
      '</div><button class="primary" data-act="closeRules">Got it</button><button class="secondary" data-act="tutorial">Replay the tutorial</button><button class="link" data-act="mute">' + (P.muted ? 'Sound: off (tap to turn on)' : 'Sound: on (tap to turn off)') + '</button></div></div>';
  }

  // A small picture of each board: n x n cells split into boxes, with grey stacks topped by a dropped tile.
  function boardIcon(b) {
    var n = b.size, cell = n === 9 ? 3.4 : n === 6 ? 5 : 7, gap = n === 9 ? 0.8 : 1.4, box = 2.2, out = '', colors = ['#FF6B7A', '#FFB547', '#6EE7A8', '#4FC3F7', '#9D8CFF'];
    var span = n * cell + (n - 1) * gap + (n / b.boxCols - 1) * box;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      var x = c * (cell + gap) + Math.floor(c / b.boxCols) * box, y = r * (cell + gap) + Math.floor(r / b.boxRows) * box;
      var top = n - 1 - (c * 5 + 2) % Math.max(2, n / 2 | 0), fill = r < top ? 'rgba(255,255,255,0.10)' : r === top ? colors[c % colors.length] : '#59617F';
      out += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + cell + '" height="' + cell + '" rx="' + (cell * 0.28).toFixed(1) + '" fill="' + fill + '"/>';
    }
    return '<svg width="40" height="40" viewBox="0 0 ' + span.toFixed(1) + ' ' + span.toFixed(1) + '" aria-hidden="true">' + out + '</svg>';
  }

  function boardStats(b) {
    var cleared = 0, stars = 0;
    b.levels.forEach(function (lv) { if (P.best[lv.id]) { cleared++; stars += P.best[lv.id]; } else if (P.skipped[lv.id]) cleared++; });
    return { cleared: cleared, stars: stars };
  }

  function profileForm(mode) {
    var f = S.form;
    return '<label class="fld"><span>Your name</span><input id="f-name" type="text" maxlength="20" autocomplete="given-name" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="e.g. Alex" value="' + esc(f.name) + '"></label>' +
      '<div id="f-msg" class="fmsg" role="status">' + esc(formMessage()) + '</div>' +
      '<button id="f-go" class="primary" data-act="saveProfile"' + (formOk() ? '' : ' disabled') + '>' + (mode === 'edit' ? 'Save' : 'Let’s play') + '</button>';
  }

  function welcomeScreen() {
    var tops = [1, 2, 3, 4], grid = S4.slice(1), t = '', c, r;
    for (c = 0; c < 4; c++) {
      var cells = '<span class="t" style="' + tileVars(tops[c]) + ';--dl:' + (c * 0.35).toFixed(2) + 's">' + tops[c] + '</span>';
      for (r = 0; r < 3; r++) cells += '<span class="g">' + grid[r][c] + '</span>';
      t += '<div class="wl-col">' + cells + '</div>';
    }
    return '<div class="screen welcome scroll"><div class="wl-board" aria-hidden="true">' + t + '</div>' +
      '<h1>Welcome to Numfall</h1><p class="wl-p">Drop numbers into columns and beat the clock on three boards. But first, who’s playing?</p>' +
      profileForm('new') +
      '<p class="priv">Your name stays on this device (the iPhone app also keeps it in your own iCloud). It is never sent to us, and you can change or delete it any time.</p>' +
      '<nav class="legal" aria-label="Legal and help"><a href="https://www.numfall.store/privacy" target="_blank" rel="noopener">Privacy Policy</a><a href="https://www.numfall.store/terms" target="_blank" rel="noopener">Terms of Use</a><a href="https://www.numfall.store/support" target="_blank" rel="noopener">Help &amp; Contact</a></nav></div>';
  }

  function ago(t) { try { return new Date(t).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function outcomeText(r) { return r.out === 'won' ? '★★★'.slice(0, r.stars) + '☆☆☆'.slice(0, 3 - r.stars) + ' cleared' : r.out === 'timeUp' ? 'Time’s up' : r.out === 'outOfHearts' ? 'Out of hearts' : 'Left early'; }

  function playerSheet() {
    var p = P.profile || { name: '' };
    if (S.form.edit) return '<div class="veil"><div class="sheet"><h2>Your name</h2>' + profileForm('edit') + '<button class="link" data-act="closePlayer">Cancel</button></div></div>';
    var cleared = Object.keys(P.best).length, list = P.sessions.slice(-8).reverse().map(function (r) { var b = boardById(r.board); return '<div><span>' + esc(b.name) + ' ' + r.n + ' · ' + esc(outcomeText(r)) + '</span><small>' + r.secs + 's · ' + esc(ago(r.t)) + '</small></div>'; }).join('');
    var reset = S.confirmReset ? '<p style="color:var(--bad)">This deletes your name, stars, Sparks and session history from this browser.</p><button class="secondary" style="color:var(--bad)" data-act="resetYes">Yes, delete everything</button><button class="link" data-act="resetNo">Keep my progress</button>' : '<button class="link" style="color:var(--faint)" data-act="reset">Delete my data…</button>';
    return '<div class="veil"><div class="sheet"><div style="display:flex;align-items:center;gap:12px"><span class="av" style="width:48px;height:48px;border-radius:24px;font-size:22px">' + esc(Array.from(p.name)[0] || '?').toUpperCase() + '</span><div style="min-width:0"><h2 style="font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(p.name) + '</h2><div style="color:var(--muted);font-size:14px">Player</div></div></div>' +
      '<div class="stats"><div class="stat"><b>' + P.sessions.length + '</b><span>sessions</span></div><div class="stat"><b>' + cleared + '</b><span>levels cleared</span></div><div class="stat"><b>' + P.wallet + '</b><span>Sparks</span></div></div>' +
      (list ? '<div class="hist" aria-label="Recent sessions">' + list + '</div>' : '<p style="font-size:14px">No sessions yet. Play a level and it shows up here.</p>') +
      '<p style="font-size:12.5px;color:var(--muted);text-align:center">Sessions are saved in this browser. The iPhone app also saves them to your own iCloud, never to our servers.</p>' +
      '<button class="secondary" data-act="editProfile">Change name</button><button class="primary" data-act="closePlayer">Done</button>' + reset + '</div></div>';
  }

  // Difficulty meter: n of 5 flames lit. Drawn as vector paths, one flame per chapter step.
  var FLAME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 1.5c.3 3 1.6 4.6 3.1 6.3 1.6 1.9 3 3.8 3 6.6A7.6 7.6 0 0 1 12 22a7.6 7.6 0 0 1-7.6-7.6c0-2.6 1.1-4.6 2.5-6 .2 1.6.9 2.6 1.9 3.2C8.4 8.8 10.4 4.4 13.5 1.5z"/></svg>';
  function flameRow(n) {
    var h = '';
    for (var i = 1; i <= D.MAX_FLAMES; i++) h += FLAME.replace('<svg ', '<svg class="' + (i <= n ? 'on' : 'off') + '" ');
    return '<span class="flames" role="img" aria-label="Difficulty ' + n + ' of ' + D.MAX_FLAMES + ' flames">' + h + '</span>';
  }

  function homeScreen() {
    var board = boardById(P.board), next = nextIndex(), chaptersHtml = '';
    var picker = BOARDS.map(function (b) {
      var st = boardStats(b), on = b.id === board.id;
      return '<button class="bd' + (on ? ' on' : '') + '" data-act="board" data-b="' + b.id + '" aria-pressed="' + on + '" aria-label="' + b.name + ' board, ' + b.size + ' by ' + b.size + ', ' + st.cleared + ' of ' + b.levels.length + ' levels done">' +
        boardIcon(b) + '<span class="nm">' + b.name + '</span><span class="sz">' + b.size + '×' + b.size + '</span><span class="pr">' + st.cleared + '/' + b.levels.length + '</span></button>';
    }).join('');
    var chapters = Math.ceil(LEVELS.length / 10);
    for (var ch = 1; ch <= chapters; ch++) {
      var first = (ch - 1) * 10, last = Math.min(LEVELS.length, ch * 10) - 1, range = 'Levels ' + (first + 1) + '–' + (last + 1);
      var cname = D.chapterName(board.id, ch), fl = D.chapterFlames(ch, chapters);
      if (!unlocked(first)) { chaptersHtml += '<section class="chapter closed" aria-label="Chapter ' + ch + ', ' + esc(cname) + ', ' + range + ', difficulty ' + fl + ' of ' + D.MAX_FLAMES + ', locked"><div><div class="t">Chapter ' + ch + ' · ' + esc(cname) + '</div><div class="sub" aria-hidden="true">' + range + flameRow(fl) + '</div></div><span>Locked</span></section>'; continue; }
      var tiles = '', stars = 0;
      for (var i = first; i <= last; i++) {
        var lv = LEVELS[i], best = P.best[lv.id] || 0; stars += best;
        var cls = 'lv', sub = '', act = 'data-act="play" data-i="' + i + '"', aria;
        if (best) { cls += ' done'; sub = '★★★'.slice(0, best) + '☆☆☆'.slice(0, 3 - best); aria = 'Level ' + lv.number + ', ' + best + ' stars'; }
        else if (P.skipped[lv.id]) { cls += ' skipped'; sub = 'SKIPPED'; aria = 'Level ' + lv.number + ', skipped'; }
        else if (i === next && unlocked(i)) { cls += ' next'; sub = 'PLAY'; aria = 'Level ' + lv.number + ', play now'; }
        else if (!unlocked(i)) { cls += ' locked'; act = 'data-act="locked" data-i="' + i + '"'; sub = LOCK; aria = 'Level ' + lv.number + ', locked. Clear level ' + (lv.number - 1) + ' to unlock it.'; }
        else { aria = 'Level ' + lv.number; }
        if (lv.role === 'milestone' && !best) { cls += ' mile'; if (!sub) sub = 'CHEST'; else if (sub === LOCK) sub = LOCK + ' CHEST'; }
        tiles += '<button class="' + cls + '" ' + act + ' aria-label="' + aria + '">' + lv.number + (sub ? '<small>' + sub + '</small>' : '') + '</button>';
      }
      chaptersHtml += '<section class="chapter"><div class="chapter-head"><div><div class="n">' + board.name + ' · Chapter ' + ch + ' of ' + chapters + '</div><div class="t">' + esc(cname) + '</div><div class="sub">' + range + flameRow(fl) + '</div></div><div class="st">★ ' + stars + '/' + (last - first + 1) * 3 + '</div></div><div class="levels">' + tiles + '</div></section>';
    }
    var nl = LEVELS[next];
    var logo = '<div class="logo" aria-hidden="true"><i></i><i style="background:linear-gradient(180deg,#FFCF85 0%,#FFB547 58%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #C9862A"></i><i style="background:linear-gradient(180deg,#8ADAFB 0%,#4FC3F7 58%);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 3px 0 #2E8DB8"></i><i style="background:linear-gradient(180deg,#363D57 0%,#2A3045 60%);box-shadow:0 3px 0 #1C2030"></i></div>';
    var nm = P.profile ? P.profile.name : '', hi = '<button class="pill who" data-act="player" aria-label="Player: ' + esc(nm) + '. Open profile and sessions"><span class="av">' + esc((Array.from(nm)[0] || '?').toUpperCase()) + '</span><span class="nm">Hi, ' + esc(nm) + '</span></button>';
    return '<div class="screen home scroll"><div class="topbar">' + hi + '<span style="display:flex;gap:8px;align-items:center"><span class="pill spark" aria-label="' + P.wallet + ' Sparks">' + SPARK + P.wallet + '</span><button class="iconbtn" data-act="rules" aria-label="How to play">?</button></span></div>' +
      '<div class="hero">' + logo + '<div><h1>Numfall</h1><p>Drop the numbers. Beat the clock.</p></div></div>' +
      '<div class="boards" role="group" aria-label="Choose a board">' + picker + '</div>' +
      '<div class="bd-info">' + esc(BOARD_TEXT[board.id] || '') + ' ' + board.levels.length + ' levels, ' + minutes(board.levels[0].timeLimit) + ' to ' + minutes(board.levels[board.levels.length - 1].timeLimit) + ' each.</div>' +
      '<button class="primary pulse" data-act="play" data-i="' + next + '" style="height:66px;flex-shrink:0">' + (P.best[nl.id] ? 'Replay' : 'Play') + ' ' + board.name + ' Level ' + nl.number + ' · ' + minutes(nl.timeLimit) + '</button>' +
      chaptersHtml + '<div class="note">' + BOARDS.reduce(function (a, b) { return a + b.levels.length; }, 0) + ' levels on 3 boards. No ads, nothing to buy. Progress is saved in this browser only.</div>' + (S.overlay === 'rules' ? rulesSheet() : S.overlay === 'player' ? playerSheet() : '') + '</div>';
  }

  var lastScreen = '', lastSheet = '';
  function render() {
    var app = document.getElementById('app');
    document.body.classList.toggle('wide', isWide());
    app.classList.toggle('wide', isWide());
    var sk = [S.screen, S.lesson, S.levelIndex, S.game && S.game.level.id].join('|'), hk = [S.screen, S.overlay, S.paused, S.form.edit].join('|');
    if (sk !== lastScreen) app.setAttribute('data-anim-screen', ''); else app.removeAttribute('data-anim-screen');
    if (hk !== lastSheet && (S.overlay || S.paused)) app.setAttribute('data-anim-sheet', ''); else app.removeAttribute('data-anim-sheet');
    lastScreen = sk; lastSheet = hk;
    if (S.screen === 'welcome') app.innerHTML = welcomeScreen();
    else if (S.screen === 'home') app.innerHTML = homeScreen();
    else { app.innerHTML = gameScreen(); fitBoard(); }
  }

  // ---------- input ----------
  document.getElementById('app').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    audio();
    var act = b.getAttribute('data-act'), g = S.game;
    S.cursorShown = false;
    switch (act) {
      case 'play': startLevel(Number(b.getAttribute('data-i'))); return;
      case 'pick': pick(Number(b.getAttribute('data-v'))); return;
      case 'locked': { var li = Number(b.getAttribute('data-i')); toast('Clear Level ' + (LEVELS[li].number - 1) + ' first to unlock Level ' + LEVELS[li].number + '. Stuck? You can skip a level after 2 tries.'); return; }
      case 'drop': dropInto(Number(b.getAttribute('data-c'))); return;
      case 'pause': S.paused = true; break;
      case 'resume': S.paused = false; break;
      case 'restart':
        if (inLesson()) { startLesson(S.lesson); break; }
        startLevel(S.levelIndex, true); return;
      case 'undo':
        if (!g || g.status !== 'play') break;
        if (!g.history.length) { setFlash('Nothing to undo', 'info'); break; }
        if (g.undosLeft <= 0 && !inLesson()) { if (P.wallet < COST.undo) { setFlash('Extra undos cost ' + COST.undo + ' Sparks', 'info'); break; } P.wallet -= COST.undo; save(); g.undosLeft = 1; }
        if (inLesson() && g.undosLeft <= 0) g.undosLeft = 1;
        D.undo(g); if (inLesson() && LESSONS[S.lesson].steps && S.step > 0) S.step--; setFlash('Undone', 'info'); break;
      case 'hint':
        if (!g || g.status !== 'play') break;
        if (P.wallet < COST.hint) { setFlash('Hints cost ' + COST.hint + ' Sparks. You have ' + P.wallet + '.', 'gold'); break; }
        var h = D.hint(g); if (!h) break;
        P.wallet -= COST.hint; save(); S.sel = h.v; S.hintCol = h.c; S.guideOverride = 'Hint: drop the ' + h.v + ' in column ' + (h.c + 1) + '. ' + h.reason; setFlash('', 'info'); break;
      case 'heart':
        if (P.wallet < COST.heart || !D.continueWithHeart(g)) break;
        P.wallet -= COST.heart; save(); S.overlay = null; setFlash('+1 heart. Keep going!', 'gold'); break;
      case 'skip':
        var id = currentLevel().id;
        if ((P.fails[id] || 0) < SKIP_AFTER || P.wallet < COST.skip) break;
        P.wallet -= COST.skip; P.skipped[id] = true; save(); S.overlay = 'skipped'; break;
      case 'next': if (S.levelIndex < LEVELS.length - 1) { startLevel(S.levelIndex + 1); return; } goHome(); return;
      case 'home': goHome(); return;
      case 'rules': S.overlay = 'rules'; if (S.screen === 'game') S.paused = true; break;
      case 'closeRules': S.overlay = null; S.confirmReset = false; break;
      case 'tutorial': startLesson(0); break;
      case 'skipTutorial': if (!P.tutorialDone) { P.tutorialDone = true; save(); } goHome(); return;
      case 'nextLesson': startLesson(S.lesson + 1); break;
      case 'boards': goHome(); return;
      case 'board': setBoard(b.getAttribute('data-b')); save(); break;
      case 'mute': P.muted = !P.muted; save(); break;
      case 'reset': S.confirmReset = true; break;
      case 'resetNo': S.confirmReset = false; break;
      case 'resetYes': P = fresh(); save(); setBoard(P.board); S.confirmReset = false; S.overlay = null; S.game = null; S.form = { name: '', edit: false }; S.screen = 'welcome'; break;
      case 'player': S.overlay = 'player'; S.form = { name: '', edit: false }; break;
      case 'closePlayer': S.overlay = null; S.confirmReset = false; S.form.edit = false; break;
      case 'editProfile': S.form = { name: P.profile ? P.profile.name : '', edit: true }; break;
      case 'saveProfile':
        var nm = cleanName(S.form.name); if (!nm) break;
        var now = Date.now(); P.profile = { name: nm, created: P.profile ? P.profile.created : now, updated: now }; save();
        S.form = { name: '', edit: false }; S.overlay = null;
        if (S.screen === 'welcome') { if (!P.tutorialDone) { startLesson(0); } else { S.screen = 'home'; } }
        break;
      case 'share':
        var text = b.getAttribute('data-text');
        try { navigator.clipboard.writeText(text).then(function () { S.copied = 'ok'; render(); }, function () { S.copied = 'fail'; render(); }); } catch (err) { S.copied = 'fail'; }
        break;
    }
    render();
  });

  // Typing in the name and age boxes updates the form without redrawing the page (a redraw would drop the keyboard).
  document.getElementById('app').addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'f-name') S.form.name = t.value;
    else return;
    var go = document.getElementById('f-go'), msg = document.getElementById('f-msg');
    if (go) go.disabled = !formOk();
    if (msg) msg.textContent = formMessage();
  });
  document.getElementById('app').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target || e.target.id !== 'f-name') return;
    e.preventDefault();
    if (formOk()) { var go = document.getElementById('f-go'); if (go) go.click(); }
  });

  // Keyboard (iPad keyboards and Mac): 1-9 pick, arrows choose a column, Return/Space drops, P pauses, Z undo, H hint.
  document.addEventListener('keydown', function (e) {
    var g = S.game; if (S.screen === 'home' || !g) return;
    if (/^[1-9]$/.test(e.key) && Number(e.key) <= g.n) { pick(Number(e.key)); return; }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { S.cursorShown = true; S.cursor = (S.cursor + (e.key === 'ArrowLeft' ? g.n - 1 : 1)) % g.n; render(); e.preventDefault(); return; }
    var onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if ((e.key === 'Enter' || e.key === ' ') && S.cursorShown && !S.overlay && !onButton) { dropInto(S.cursor); e.preventDefault(); return; }
    if ((e.key === 'p' || e.key === 'Escape') && S.screen === 'game' && g.status === 'play') { S.paused = !S.paused; if (!S.paused) S.overlay = null; render(); }
  });

  render();
})();
</script>
