<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numfall settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3A8FF;text-decoration:none}a:hover{color:#D2CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #13161F; color: #F5F6FA; font-family: Fredoka, ui-rounded, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 16px 16px; gap: 8px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 4px">
    <a href="Home.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; border-radius: 22px; background: #1E2230; color: #F5F6FA; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,5 8,12 15,19"></polyline></svg>
    </a>
    <div style="font-size: 26px; font-weight: 700">Settings</div>
  </div>

  <div style="font-size: 12px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px; padding: 2px 10px 0">GAME</div>
  <div style="background: #1E2230; border-radius: 18px; overflow: hidden">
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="5">
      <div style="height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.06)">
        <span style="display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 500">{{t.label}}</span></span>
        <button type="button" aria-label="{{t.label}}" aria-pressed="{{t.pressed}}" onClick="{{t.flip}}" style="width: 51px; height: 31px; border-radius: 16px; border: none; padding: 2px; display: flex; justify-content: {{t.side}}; background: {{t.track}}; cursor: pointer">
          <span style="width: 27px; height: 27px; border-radius: 50%; background: #FFFFFF"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="font-size: 12px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px; padding: 6px 10px 0">PROGRESS</div>
  <div style="background: #1E2230; border-radius: 18px; overflow: hidden">
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.06)"><span style="font-size: 16px; font-weight: 500">iCloud sync</span><span style="font-size: 14px; color: #6EE7A8">On · synced just now</span></div>
    <div style="height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px"><span style="font-size: 16px; font-weight: 500">Game Center</span><span style="font-size: 14px; color: #A3A9BF">[player alias]</span></div>
  </div>

  <div style="font-size: 12px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px; padding: 6px 10px 0">HELP &amp; ABOUT</div>
  <div style="background: #1E2230; border-radius: 18px; overflow: hidden">
    <a href="Demo.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 500; color: #F5F6FA; border-bottom: 1px solid rgba(255,255,255,0.06)">How to play / replay tutorial</a>
    <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 500; color: #F5F6FA; border-bottom: 1px solid rgba(255,255,255,0.06)">Privacy Policy</a>
    <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 500; color: #F5F6FA; border-bottom: 1px solid rgba(255,255,255,0.06)">Terms of Use</a>
    <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 500; color: #F5F6FA; border-bottom: 1px solid rgba(255,255,255,0.06)">Help &amp; Contact</a>
    <a href="#" style="height: 44px; display: flex; align-items: center; padding: 0 16px; font-size: 16px; font-weight: 500; color: #FF6B7A">Reset all progress…</a>
  </div>
  <div style="text-align: center; font-size: 12px; color: #8C92AB">Numfall 1.0 (1)</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sound: true, music: true, haptics: true, contrast: false };
  }
  renderVals() {
    const rows = [['sound', 'Sound effects'], ['music', 'Music'], ['haptics', 'Haptics'], ['contrast', 'High-contrast number tiles']];
    return {
      toggles: rows.map(([k, label]) => {
        const on = !!this.state[k];
        return { label, pressed: on ? 'true' : 'false', track: on ? '#6B5CF0' : 'rgba(255,255,255,0.18)', side: on ? 'flex-end' : 'flex-start', flip: () => this.setState({ [k]: !on }) };
      })
    };
  }
}
</script>
</body>
</html>
