<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropku Sparks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3A8FF;text-decoration:none}a:hover{color:#D2CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #13161F; color: #F5F6FA; font-family: Fredoka, ui-rounded, system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 16px 24px; gap: 12px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Home.dc.html" aria-label="Back to Home" style="width: 44px; height: 44px; border-radius: 22px; background: #1E2230; color: #F5F6FA; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,5 8,12 15,19"></polyline></svg>
    </a>
    <div style="flex-grow: 1; font-size: 24px; font-weight: 700">Sparks</div>
    <div aria-label="320 Sparks" style="height: 40px; padding: 0 14px; border-radius: 20px; background: rgba(255,181,71,0.14); color: #FFB547; display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: 700">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFB547"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"></path></svg>320
    </div>
  </div>

  <div style="background: #1E2230; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 18px; font-weight: 700">Every Spark is earned by playing</div>
    <div style="font-size: 14px; line-height: 1.45; color: #C3C8DA">No ads and nothing to buy. Play well, and spend Sparks when you need a hand.</div>
  </div>

  <div style="font-size: 12px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px; padding: 4px 6px 0">HOW TO EARN</div>
  <div style="background: #1E2230; border-radius: 18px; padding: 4px 16px">
    <sc-for list="{{earn}}" as="e" hint-placeholder-count="6">
      <div style="min-height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 15px; border-bottom: {{e.line}}"><span>{{e.what}}</span><span style="color: #FFB547; font-weight: 600; white-space: nowrap">{{e.n}}</span></div>
    </sc-for>
  </div>

  <div style="font-size: 12px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px; padding: 4px 6px 0">HOW TO SPEND</div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{spend}}" as="s" hint-placeholder-count="4">
      <div style="background: {{s.bg}}; border: {{s.border}}; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; font-weight: 700">{{s.name}}</span>
        <span style="font-size: 13px; line-height: 1.35; color: #C3C8DA">{{s.note}}</span>
        <span style="font-size: 17px; font-weight: 700; color: #FFB547">{{s.cost}} ✦</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <div style="text-align: center; font-size: 13px; color: #A3A9BF">Sparks are saved to your iCloud, so a new iPhone or iPad keeps them.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const earnRows = [
      ['Clear a level (first time)', '+10'],
      ['No mistakes', '+10'],
      ['Seconds left (1 per 5s)', 'up to +20'],
      ['Rows, columns, boxes & combos', '+1 / +3 / +8'],
      ['Daily Drop + streak', '+25 and up'],
      ['Milestone chest (every 10 levels)', '+100 to +250']
    ];
    const earn = earnRows.map(([what, n], i) => ({ what, n, line: i < earnRows.length - 1 ? '1px solid rgba(255,255,255,0.06)' : 'none' }));
    const card = (name, note, cost, hot) => ({ name, note, cost, bg: hot ? 'rgba(255,181,71,0.12)' : '#1E2230', border: hot ? '1.5px solid #FFB547' : '1.5px solid transparent' });
    return {
      earn,
      spend: [
        card('Hint', 'Shows the next logical drop and why', 40),
        card('Extra undo', 'After your 3 free ones', 15),
        card('+1 heart', 'Once per attempt, keeps the board', 60),
        card('Skip a level', 'After 2 tries. Come back for stars later', 400, true)
      ]
    };
  }
}
</script>
</body>
</html>
