<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropku iPad home portrait</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3A8FF;text-decoration:none}a:hover{color:#D2CBFF}
</style>
</helmet>
<div style="width: 834px; height: 1194px; box-sizing: border-box; background: #13161F; color: #F5F6FA; font-family: Fredoka, ui-rounded, system-ui, sans-serif; display: flex; flex-direction: column; padding: 48px 56px 44px; gap: 26px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="#" aria-label="Game Center" style="height: 52px; padding: 0 18px 0 8px; border-radius: 26px; background: #1E2230; color: #F5F6FA; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600">
      <span style="width: 38px; height: 38px; border-radius: 19px; background: #6B5CF0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700">R</span>Game Center
    </a>
    <div style="display: flex; gap: 12px">
      <a href="Shop.dc.html" aria-label="320 Sparks" style="height: 52px; padding: 0 18px; border-radius: 26px; background: #1E2230; color: #FFB547; display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFB547"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"></path></svg>320
      </a>
      <a href="Settings.dc.html" aria-label="Settings" style="width: 52px; height: 52px; border-radius: 26px; background: #1E2230; color: #F5F6FA; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="2" fill="#13161F"></circle><circle cx="15" cy="12" r="2" fill="#13161F"></circle><circle cx="8" cy="18" r="2" fill="#13161F"></circle></svg>
      </a>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 40px; padding: 24px 8px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0">
      <div style="width: 92px; height: 92px; border-radius: 24px; background: linear-gradient(180deg, #FFCF85 0%, #FFB547 58%); color: #13161F; font-size: 54px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 0 rgba(255,255,255,0.45), 0 8px 0 #C9862A">4</div>
      <div style="display: flex; gap: 10px">
        <div style="width: 92px; height: 92px; border-radius: 24px; background: linear-gradient(180deg, #8ADAFB 0%, #4FC3F7 58%); color: #13161F; font-size: 54px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 0 rgba(255,255,255,0.45), 0 8px 0 #2E8DB8">1</div>
        <div style="width: 92px; height: 92px; border-radius: 24px; background: linear-gradient(180deg, #363D57 0%, #2A3045 60%); color: #E6E9F2; font-size: 54px; font-weight: 600; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 0 rgba(255,255,255,0.10), 0 8px 0 #1C2030">3</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 72px; font-weight: 700; letter-spacing: -1px; line-height: 1">Dropku</div>
      <div style="font-size: 22px; color: #A3A9BF">Sudoku. But the numbers fall.</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
    <a href="LevelMap.dc.html" style="background: #1E2230; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px; color: #F5F6FA">
      <div style="font-size: 15px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px">CHAPTER 2 OF 10</div>
      <div style="font-size: 28px; font-weight: 700">Planning</div>
      <div style="height: 12px; border-radius: 6px; background: #2A3045; overflow: hidden"><div style="width: 11%; height: 100%; background: #6B5CF0; border-radius: 6px"></div></div>
      <div style="font-size: 17px; color: #D7DBE8">Level 12 of 100 · chest at Level 20</div>
    </a>
    <a href="Daily.dc.html" style="background: #1E2230; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px; color: #F5F6FA">
      <div style="font-size: 15px; font-weight: 600; color: #FF8AD8; letter-spacing: 1.5px">DAILY DROP</div>
      <div style="font-size: 28px; font-weight: 700">4-day streak</div>
      <div style="display: flex; gap: 8px">
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FF8AD8"></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FF8AD8"></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: #FF8AD8"></span>
        <span style="width: 34px; height: 34px; box-sizing: border-box; border-radius: 10px; border: 2px solid #FF8AD8"></span>
        <span style="width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.06)"></span>
      </div>
      <div style="font-size: 17px; color: #D7DBE8">Today: 6×6 · 180 seconds · +25 ✦</div>
    </a>
  </div>

  <div style="background: #1E2230; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 22px; font-weight: 700">Chapter 2 · Levels 11–20</div>
      <a href="LevelMap.dc.html" style="font-size: 17px; font-weight: 600">See all</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{levels}}" as="l" hint-placeholder-count="10">
        <div aria-label="{{l.aria}}" style="height: 58px; box-sizing: border-box; border-radius: 16px; background: {{l.bg}}; border: {{l.border}}; color: {{l.fg}}; box-shadow: {{l.shadow}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700">{{l.label}}</div>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 20px; align-items: center">
    <a href="Demo.dc.html" style="height: 76px; padding: 0 32px; border-radius: 38px; background: #1E2230; color: #F5F6FA; font-size: 20px; font-weight: 600; display: flex; align-items: center">How to play</a>
    <a href="iPadGame.dc.html" style="flex-grow: 1; height: 76px; border-radius: 38px; background: #6B5CF0; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 6px 0 #4A3DC0">
      <span style="font-size: 26px; font-weight: 700">Play Level 12</span>
      <span style="font-size: 15px; font-weight: 500; opacity: 0.85">6×6 · 150-second limit</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":834,"height":1194}}'>
class Component extends DCLogic {
  renderVals() {
    const levels = [];
    for (let n = 11; n <= 20; n++) {
      if (n === 11) levels.push({ label: '11', aria: 'Level 11, 2 stars', bg: 'linear-gradient(180deg, #363D57 0%, #2A3045 60%)', fg: '#E6E9F2', border: 'none', shadow: '0 4px 0 #1C2030' });
      else if (n === 12) levels.push({ label: '12', aria: 'Level 12, play now', bg: '#6B5CF0', fg: '#FFFFFF', border: 'none', shadow: '0 4px 0 #4A3DC0, 0 0 20px rgba(107,92,240,0.5)' });
      else if (n === 20) levels.push({ label: '★', aria: 'Level 20, milestone chest', bg: 'rgba(255,181,71,0.12)', fg: '#FFB547', border: '2px solid #FFB547', shadow: 'none' });
      else levels.push({ label: String(n), aria: 'Level ' + n + ', locked', bg: 'transparent', fg: '#8C92AB', border: '1.5px dashed rgba(255,255,255,0.16)', shadow: 'none' });
    }
    return { levels };
  }
}
</script>
</body>
</html>
