<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dropku tutorial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3A8FF;text-decoration:none}a:hover{color:#D2CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #13161F; color: #F5F6FA; font-family: Fredoka, ui-rounded, system-ui, sans-serif; display: flex; flex-direction: column; padding: 54px 18px 26px; gap: 14px; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Demo.dc.html" aria-label="Watch the demo again" style="width: 44px; height: 44px; border-radius: 22px; background: #1E2230; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: #F5F6FA">?</a>
    <div style="font-size: 14px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px">{{lessonTag}}</div>
    <a href="Home.dc.html" style="height: 36px; padding: 0 14px; border-radius: 18px; background: #1E2230; display: flex; align-items: center; font-size: 14px; font-weight: 600">Skip</a>
  </div>

  <div style="background: #1E2230; border-radius: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 22px; font-weight: 700">{{title}}</div>
    <div style="font-size: 15px; line-height: 1.45; color: #D7DBE8">{{text}}</div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 28px">
    <sc-if value="{{showHearts}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; gap: 4px" aria-label="{{heartsLabel}}">
        <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="{{h.fill}}" stroke="#FF6B7A" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2 0 3.6 1.1 5.2 3 1.6-1.9 3.2-3 5.2-3 3.5 0 5.6 3.6 4.3 6.8C19.5 16.4 12 21 12 21z"></path></svg>
        </sc-for>
      </div>
    </sc-if>
    <div style="font-size: 15px; font-weight: 600; color: #FFB547">{{stepText}}</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
    <div style="display: flex; gap: 8px; padding: 12px; border-radius: 24px; background: #1E2230">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="4">
        <button type="button" aria-label="{{col.aria}}" onClick="{{col.drop}}" style="display: flex; flex-direction: column; gap: 8px; padding: 0; border: none; background: transparent; cursor: pointer; margin-left: {{col.ml}}; border-radius: 16px; outline: {{col.outline}}; outline-offset: 4px; font-family: inherit">
          <sc-for list="{{col.cells}}" as="c" hint-placeholder-count="4">
            <span style="width: 60px; height: 60px; box-sizing: border-box; border-radius: 15px; background: {{c.bg}}; border: {{c.border}}; color: {{c.fg}}; box-shadow: {{c.shadow}}; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: {{c.mt}}; transition: all 0.2s">{{c.v}}</span>
          </sc-for>
        </button>
      </sc-for>
    </div>
    <div style="min-height: 46px; max-width: 320px; text-align: center; font-size: 16px; font-weight: 600; line-height: 1.35; color: {{flashColor}}">{{flash}}</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
    <div style="font-size: 13px; font-weight: 500; color: #A3A9BF">{{trayLabel}}</div>
    <div style="display: flex; gap: 10px">
      <sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
        <button type="button" aria-label="{{t.aria}}" onClick="{{t.pick}}" style="width: 62px; height: 66px; border-radius: 16px; border: {{t.border}}; background: {{t.bg}}; color: #13161F; opacity: {{t.op}}; box-shadow: 0 5px 0 {{t.shadow}}; transform: translateY({{t.lift}}); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; cursor: pointer; font-family: inherit; outline: {{t.outline}}; outline-offset: 4px; transition: all 0.15s">
          <span style="font-size: 30px; font-weight: 700; line-height: 1">{{t.v}}</span>
          <span style="font-size: 11px; font-weight: 600">×{{t.left}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{showResult}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; border-radius: 32px; background: #272C3D; border: 1.5px solid {{resultBorder}}; padding: 24px 20px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -20px 60px rgba(0,0,0,0.55)">
      <div style="font-size: 26px; font-weight: 700; color: {{resultColor}}">{{resultTitle}}</div>
      <div style="font-size: 16px; line-height: 1.45; color: #D7DBE8">{{resultText}}</div>
      <sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{nextLesson}}" style="height: 56px; border-radius: 28px; border: none; background: #6B5CF0; color: #FFFFFF; font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer; box-shadow: 0 5px 0 #4A3DC0">Next lesson</button>
      </sc-if>
      <sc-if value="{{isFinal}}" hint-placeholder-val="{{false}}">
        <a href="Home.dc.html" style="height: 56px; border-radius: 28px; background: #6B5CF0; color: #FFFFFF; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #4A3DC0">Start Level 1 · +50 ✦ welcome gift</a>
      </sc-if>
      <sc-if value="{{isLose}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{restart}}" style="height: 56px; border-radius: 28px; border: none; background: #6B5CF0; color: #FFFFFF; font-family: inherit; font-size: 19px; font-weight: 700; cursor: pointer">Try again</button>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const N = 4, B = 2;
const SOL = [[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]];
const TILE = { 1: ['#FF6B7A','#C94656'], 2: ['#FFB547','#C9862A'], 3: ['#F5E663','#BFB244'], 4: ['#6EE7A8','#3FB27A'] };
function gridWithout(empties) { return SOL.map((row, r) => row.map((v, c) => (empties.some(([er, ec]) => er === r && ec === c) ? 0 : v))); }
const LESSONS = [
  {
    title: 'Drop a number',
    text: 'The top row is missing a 2 and a 4. Column 2 can’t take the 4 (it already has one), so it needs the 2. Tap the 2, then tap column 2.',
    empties: [[0,1],[0,3]], hearts: false,
    steps: [{ v: 2, c: 1 }, { v: 4, c: 3 }],
    stepTexts: ['Tap 2, then tap the glowing column', 'Now the 4 into the last gap'],
    win: 'That’s the basic move: pick a number, tap a column, and it drops in.'
  },
  {
    title: 'Order matters',
    text: 'Column 4 has two gaps. The TOP one needs a 4, but numbers fall to the LOWEST gap first. So what goes in the lower gap? Try dropping the 4 first if you’re curious.',
    empties: [[0,3],[1,3],[0,2]], hearts: false,
    steps: [{ v: 2, c: 3 }, { v: 4, c: 3 }, { v: 3, c: 2 }],
    stepTexts: ['Fill the lower gap first: drop the 2', 'Now the 4 lands on top', 'Last one: which number does column 3 need?'],
    win: 'You planned the order: lower gaps first. That’s the heart of Dropku.'
  },
  {
    title: 'On your own',
    text: 'No more help. Wrong drops crack and cost a heart. Lose all 3 and the level fails, but retrying is free. Fill the grid!',
    empties: [[0,0],[1,0],[0,2],[0,3],[1,3]], hearts: true,
    steps: null,
    win: 'Tutorial complete! Real levels add a countdown: 60 seconds at first, more as the grids grow. Seconds you have left turn into bonus Sparks.'
  }
];
function boxHas(grid, r, c, v) {
  const r0 = Math.floor(r / B) * B, c0 = Math.floor(c / B) * B;
  for (let i = r0; i < r0 + B; i++) for (let j = c0; j < c0 + B; j++) if (grid[i][j] === v) return true;
  return false;
}
function landing(grid, c) { for (let r = N - 1; r >= 0; r--) if (grid[r][c] === 0) return r; return -1; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh(0);
  }
  fresh(li) {
    const g = gridWithout(LESSONS[li].empties);
    return { li, grid: g, placed: g.map((row) => row.map(() => false)), sel: null, hearts: 3, step: 0, status: 'play', flash: '', flashColor: '#A3A9BF', crack: null, glow: [] };
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); }
  left(grid, v) { let n = 0; grid.forEach((row) => row.forEach((x) => { if (x === v) n++; })); return N - n; }
  drop(c) {
    const s = this.state, L = LESSONS[s.li];
    if (s.status !== 'play') return;
    if (s.sel === null) { this.setState({ flash: 'First tap a number at the bottom', flashColor: '#A3A9BF' }); return; }
    const r = landing(s.grid, c);
    if (r < 0) { this.setState({ flash: 'That column is already full', flashColor: '#A3A9BF' }); return; }
    const v = s.sel;
    if (SOL[r][c] !== v) {
      let why = 'A ' + v + ' doesn’t belong in that gap.';
      if (s.grid[r].includes(v)) why = 'That row already has a ' + v + '.';
      else if (s.grid.some((row) => row[c] === v)) why = 'That column already has a ' + v + '.';
      else if (boxHas(s.grid, r, c, v)) why = 'That box already has a ' + v + '.';
      if (s.li === 1 && v === 4 && c === 3) why = 'See? The 4 fell to the LOWER gap, where it doesn’t fit. Fill the lower gap first.';
      const hearts = L.hearts ? s.hearts - 1 : s.hearts;
      this.setState({ hearts, crack: { r, c, v }, flash: 'Crack! ' + why + (L.hearts ? ' (−1 heart)' : ''), flashColor: '#FF6B7A', status: hearts <= 0 ? 'lose' : 'play' });
      clearTimeout(this.t1);
      this.t1 = setTimeout(() => this.setState({ crack: null }), 900);
      return;
    }
    const grid = s.grid.map((row) => row.slice()); const placed = s.placed.map((row) => row.slice());
    grid[r][c] = v; placed[r][c] = true;
    const units = [];
    if (grid[r].every((x) => x)) units.push(grid[r].map((_, j) => [r, j]));
    if (grid.every((row) => row[c])) units.push(grid.map((_, i) => [i, c]));
    const r0 = Math.floor(r / B) * B, c0 = Math.floor(c / B) * B, bx = [];
    for (let i = r0; i < r0 + B; i++) for (let j = c0; j < c0 + B; j++) bx.push([i, j]);
    if (bx.every(([i, j]) => grid[i][j])) units.push(bx);
    const names = ['', 'Line complete! +1 ✦', 'DOUBLE! +3 ✦', 'TRIPLE!! +8 ✦'];
    const full = grid.every((row) => row.every((x) => x));
    this.setState({
      grid, placed, step: s.step + 1, glow: [].concat(...units).map(([i, j]) => i + ',' + j),
      sel: this.left(grid, v) > 0 && !L.steps ? v : null,
      flash: names[units.length] || 'Nice drop!', flashColor: units.length > 1 ? '#FFB547' : '#6EE7A8',
      status: full ? 'win' : 'play'
    });
    clearTimeout(this.t2);
    this.t2 = setTimeout(() => this.setState({ glow: [] }), 800);
  }
  renderVals() {
    const s = this.state, L = LESSONS[s.li];
    const guide = L.steps && s.status === 'play' ? L.steps[s.step] : null;
    const cols = [];
    for (let c = 0; c < N; c++) {
      const ghostR = s.sel !== null && s.status === 'play' ? landing(s.grid, c) : -2;
      const cells = [];
      for (let r = 0; r < N; r++) {
        const v = s.grid[r][c];
        const mt = r === B ? '8px' : '0px';
        const glow = s.glow.indexOf(r + ',' + c) >= 0;
        let cell;
        if (s.crack && s.crack.r === r && s.crack.c === c) cell = { v: s.crack.v, bg: 'rgba(255,107,122,0.22)', fg: '#FF6B7A', border: '2px dashed #FF6B7A', shadow: 'none' };
        else if (v && !s.placed[r][c]) cell = { v, bg: '#2A3045', fg: '#E6E9F2', border: 'none', shadow: glow ? '0 0 0 3px #FFFFFF, 0 0 18px rgba(255,255,255,0.6)' : '0 4px 0 #1C2030' };
        else if (v) cell = { v, bg: TILE[v][0], fg: '#13161F', border: 'none', shadow: glow ? '0 0 0 3px #FFFFFF, 0 0 18px rgba(255,255,255,0.6)' : '0 4px 0 ' + TILE[v][1] };
        else if (ghostR === r) cell = { v: s.sel, bg: 'rgba(255,255,255,0.02)', fg: TILE[s.sel][0], border: '2px dashed ' + TILE[s.sel][0], shadow: 'none' };
        else cell = { v: '', bg: 'rgba(255,255,255,0.03)', fg: '#13161F', border: '1.5px dashed rgba(255,255,255,0.16)', shadow: 'none' };
        cells.push({ ...cell, mt });
      }
      cols.push({
        cells, ml: c === B ? '8px' : '0px',
        outline: guide && guide.c === c && s.sel === guide.v ? '3px solid #FFB547' : '0px solid transparent',
        aria: 'Drop into column ' + (c + 1),
        drop: () => this.drop(c)
      });
    }
    const tray = [1, 2, 3, 4].map((v) => {
      const left = this.left(s.grid, v), on = s.sel === v;
      return {
        v, left, aria: 'Number ' + v + ', ' + left + ' left',
        bg: TILE[v][0], shadow: TILE[v][1],
        border: on ? '3px solid #FFFFFF' : '3px solid transparent',
        lift: on ? '-6px' : '0px', op: left === 0 ? '0.25' : '1',
        outline: guide && guide.v === v && !on ? '3px solid #FFB547' : '0px solid transparent',
        pick: () => { if (left > 0 && s.status === 'play') this.setState({ sel: on ? null : v, flash: '' }); }
      };
    });
    const last = s.li === LESSONS.length - 1;
    return {
      lessonTag: 'LESSON ' + (s.li + 1) + ' OF 3',
      title: L.title, text: L.text,
      stepText: guide ? L.stepTexts[s.step] : (L.hearts ? 'Hearts' : ''),
      showHearts: L.hearts,
      hearts: [0, 1, 2].map((i) => ({ fill: i < s.hearts ? '#FF6B7A' : 'transparent' })),
      heartsLabel: s.hearts + ' hearts left',
      cols, tray,
      trayLabel: s.sel === null ? 'Tap a number' : 'Now tap a column. The dashed tile shows where it lands.',
      flash: s.flash, flashColor: s.flashColor,
      showResult: s.status !== 'play',
      hasNext: s.status === 'win' && !last, isFinal: s.status === 'win' && last, isLose: s.status === 'lose',
      resultTitle: s.status === 'win' ? (last ? 'You’re ready!' : 'Lesson ' + (s.li + 1) + ' done!') : 'Out of hearts',
      resultText: s.status === 'win' ? L.win : 'That’s how a level is lost. No penalty here: try again!',
      resultColor: s.status === 'win' ? '#6EE7A8' : '#FF6B7A',
      resultBorder: s.status === 'win' ? 'rgba(110,231,168,0.5)' : 'rgba(255,107,122,0.5)',
      nextLesson: () => this.setState(this.fresh(s.li + 1)),
      restart: () => this.setState(this.fresh(s.li))
    };
  }
}
</script>
</body>
</html>
