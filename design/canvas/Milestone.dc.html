<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numfall milestone chest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3A8FF;text-decoration:none}a:hover{color:#D2CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #13161F; color: #F5F6FA; font-family: Fredoka, ui-rounded, system-ui, sans-serif; display: flex; flex-direction: column; padding: 72px 22px 30px; gap: 18px; overflow: hidden">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <div style="font-size: 15px; font-weight: 600; color: #FFB547; letter-spacing: 2px">MILESTONE · LEVEL 20</div>
    <h1 style="margin: 0; font-size: 36px; font-weight: 700">Finding Your Feet complete!</h1>
  </div>

  <div style="display: flex; justify-content: center; padding: 10px 0">
    <button type="button" onClick="{{open}}" aria-label="{{chestLabel}}" style="width: 200px; height: 170px; border: none; background: transparent; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative">
      <span style="position: absolute; top: 0; left: 20px; right: 20px; height: 120px; border-radius: 50%; background: rgba(255,181,71,{{glow}}); filter: blur(30px)"></span>
      <span style="width: 170px; height: 54px; border-radius: 26px 26px 6px 6px; background: #C9862A; border: 4px solid #FFB547; box-sizing: border-box; transform: translateY({{lid}}) rotate({{lidTilt}}); transition: all 0.4s; position: relative"></span>
      <span style="width: 170px; height: 90px; border-radius: 8px 8px 18px 18px; background: #A86C1C; border: 4px solid #FFB547; box-sizing: border-box; display: flex; align-items: center; justify-content: center; position: relative">
        <span style="width: 30px; height: 36px; border-radius: 8px; background: #FFB547"></span>
      </span>
    </button>
  </div>

  <sc-if value="{{closed}}" hint-placeholder-val="{{true}}">
    <div style="text-align: center; font-size: 17px; color: #C3C8DA">Tap the chest to open it</div>
  </sc-if>
  <sc-if value="{{opened}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 14px; background: #1E2230; border-radius: 18px; padding: 12px 16px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(255,181,71,0.16); display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#FFB547"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"></path></svg></span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 600">Sparks</span><span style="font-size: 20px; font-weight: 700; color: #FFB547">+150</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; background: #1E2230; border-radius: 18px; padding: 12px 16px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: rgba(110,231,168,0.16); color: #6EE7A8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="#6EE7A8"><polygon points="12,2 15,9 22,9.3 16.5,14 18.5,21.5 12,17.3 5.5,21.5 7.5,14 2,9.3 9,9"></polygon></svg></span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 600">Chapter stars bonus (24/30 ★)</span><span style="font-size: 20px; font-weight: 700; color: #FFB547">+48</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; background: #1E2230; border-radius: 18px; padding: 12px 16px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #9D8CFF; display: flex; align-items: center; justify-content: center; color: #13161F; font-size: 22px; font-weight: 700">6</span>
        <span style="flex-grow: 1; font-size: 17px; font-weight: 600">New tile theme: Neon</span><span style="font-size: 14px; font-weight: 600; color: #B3A8FF">Unlocked</span>
      </div>
    </div>
  </sc-if>

  <div style="flex-grow: 1"></div>

  <div style="background: #1E2230; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; font-weight: 600; color: #A3A9BF; letter-spacing: 1.5px">NEXT: CLASSIC · CHAPTER 3 · LEVELS 21–30</div>
    <div style="font-size: 15px; line-height: 1.4; color: #D7DBE8">More gaps and fewer obvious moves. Want a bigger challenge? Master 9×9 is open too.</div>
  </div>
  <a href="LevelMap.dc.html" style="height: 58px; border-radius: 29px; background: #6B5CF0; color: #FFFFFF; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 0 #4A3DC0">Collect &amp; continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false }; }
  renderVals() {
    const o = this.state.open;
    return {
      opened: o, closed: !o,
      lid: o ? '-40px' : '0px', lidTilt: o ? '-14deg' : '0deg', glow: o ? '0.55' : '0.15',
      chestLabel: o ? 'Chest opened' : 'Open the milestone chest',
      open: () => this.setState({ open: true })
    };
  }
}
</script>
</body>
</html>
