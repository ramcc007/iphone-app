# XcodeGen spec for the NumFall iPhone + iPad app.
# On a Mac: `brew install xcodegen`, then `cd ios && xcodegen`, then open Numfall.xcodeproj.
name: Numfall
options:
  bundleIdPrefix: store.numfall          # reverse of numfall.store (owner's decision, 8 October 2026)
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NumfallCore:
    path: NumfallCore
targets:
  Numfall:
    type: application
    platform: iOS
    sources:
      - path: Numfall
    dependencies:
      - package: NumfallCore
    entitlements:
      path: Numfall/Numfall.entitlements
      # Listed here because XcodeGen writes this file from these properties (an empty list gave build 7 no Game Center or iCloud).
      properties:
        com.apple.developer.game-center: true                  # achievements and leaderboards (optional for the player)
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)   # iCloud key-value progress sync
    info:
      path: Numfall/Info.plist
      properties:
        CFBundleDisplayName: NumFall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: store.numfall.app    # permanent: registered in the Apple Developer account and App Store Connect
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"                  # iPhone and iPad
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
      configs:
        # Release is only built by .github/workflows/testflight.yml, which creates a short-lived Apple Distribution
        # certificate and App Store profile and passes the profile's name in NUMFALL_PROFILE_NAME. Debug stays automatic.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(NUMFALL_PROFILE_NAME)
