# XcodeGen spec for the Numfall iPhone + iPad app.
# On a Mac: `brew install xcodegen`, then `cd ios && xcodegen`, then open Numfall.xcodeproj.
name: Numfall
options:
  bundleIdPrefix: com.example            # [Check] change to your own reverse domain before release
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NumfallCore:
    path: NumfallCore
targets:
  Numfall:
    type: application
    platform: iOS
    sources:
      - path: Numfall
    dependencies:
      - package: NumfallCore
    entitlements:
      path: Numfall/Numfall.entitlements
    info:
      path: Numfall/Info.plist
      properties:
        CFBundleDisplayName: Numfall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.puzzle-games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.numfall   # [Check] must match your App Store Connect app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"                  # iPhone and iPad
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
